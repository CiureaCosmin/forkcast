name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and format (Biome)
        run: npx biome ci .
      - name: Typecheck (TypeScript)
        run: npm run typecheck
      - name: Unit tests (Jest)
        run: npm test
